project_id = "gorqyovidpdvuockzndm"

[auth]
enabled = true
site_url = "https://paineldecontrole.newvox.site"
additional_redirect_urls = ["https://paineldecontrole.newvox.site/redefinir-senha"]
enable_signup = false
minimum_password_length = 12

[auth.email]
# This enables EMAIL LOGIN (ExternalEmailEnabled in the official CLI mapping).
# Public registration remains blocked by [auth].enable_signup = false above.
enable_signup = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m"
otp_length = 8

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

